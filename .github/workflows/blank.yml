name: Procurement Data Platform CI/CD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:

  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Validate Python files
        run: |
          python -m compileall .

      - name: Check SQL files
        run: |
          echo "Checking SQL files..."
          find . -name "*.sql" -print

      - name: Check required folders
        run: |
          test -d bronze
          test -d .github/workflows
          echo "Required folders are present."

  data_quality:
    name: Data Quality Check
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run data validation
        run: |
          if [ -f python/validation.py ]; then
            python python/validation.py
          else
            echo "validation.py not found."
            echo "Data validation skipped."
          fi

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: data_quality

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest tests -v
          else
            echo "No tests directory found."
            echo "Tests skipped."
          fi

  deployment:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deployment status
        run: |
          echo "All CI checks passed."
          echo "Procurement Data Platform is ready for deployment."
